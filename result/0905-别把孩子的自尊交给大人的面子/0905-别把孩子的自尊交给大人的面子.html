      <header><h1>别把孩子的自尊交给大人的面子</h1></header>
      <h2>别让社交场合替你定义孩子</h2>
<p><span class="sentence-line">饭桌上的玩笑，</span><span class="sentence-line">可能只是大人的客气；</span><span class="sentence-line">落到孩子身上，</span><span class="sentence-line">却像一次公开判决。</span><span class="sentence-line">拿他比较、替他谦虚，</span><span class="sentence-line">换来的不是成长，</span><span class="sentence-line">而是失去体面。</span></p>
<figure><img src="images/image-001.png" alt="社交场合里孩子被大人的面子牵着走" loading="lazy"></figure>
<h2>孩子会把评价住进心里</h2>
<p><span class="sentence-line">父母反复说出的缺点，</span><span class="sentence-line">会变成旁人的印象，</span><span class="sentence-line">也会变成孩子认识自己的起点。</span><span class="sentence-line">听久了，</span><span class="sentence-line">他可能不再尝试，</span><span class="sentence-line">只用一句“我就是不行”替自己下结论。</span></p>
<figure><img src="images/image-002.png" alt="重复揭短在孩子心里堆成沉重的负担" loading="lazy"></figure>
<h2>把成长还给孩子</h2>
<p><span class="sentence-line">分数、挫败和不擅长，</span><span class="sentence-line">都需要安静的空间。</span><span class="sentence-line">别急着把孩子塞进模板，</span><span class="sentence-line">允许他试错、绕路，</span><span class="sentence-line">才能找到愿意走的方向。</span></p>
<figure><img src="images/image-003.png" alt="孩子摆脱外界尺子，寻找自己的成长方式" loading="lazy"></figure>
<h2>父母给底气，不给判决</h2>
<p><span class="sentence-line">好的养育不是替孩子写答案，</span><span class="sentence-line">而是看见他的样子，</span><span class="sentence-line">在他需要时给一句肯定。</span><span class="sentence-line">少一点评判，</span><span class="sentence-line">多一点信任，</span><span class="sentence-line">孩子才有勇气长成自己。</span></p>
<figure><img src="images/image-004.png" alt="父母在身边支持孩子做真实的自己" loading="lazy"></figure>
