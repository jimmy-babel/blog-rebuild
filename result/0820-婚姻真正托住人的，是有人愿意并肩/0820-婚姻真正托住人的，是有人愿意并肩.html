      <header><h1>婚姻真正托住人的，是有人愿意并肩</h1></header>
      <h2>婚姻不是一场完成任务</h2>
<p><span class="sentence-line">仪式会结束，</span><span class="sentence-line">热烈也会回到日常。</span><span class="sentence-line">决定两个人能走多久的，</span><span class="sentence-line">不是外界眼光，</span><span class="sentence-line">而是是否愿意把彼此放进未来，</span><span class="sentence-line">共同承担选择的后果。</span></p>
<figure><img src="images/image-001.png" alt="夫妻一起寻找共同的方向" loading="lazy"></figure>
<h2>好的关系，是生活里的同盟</h2>
<p><span class="sentence-line">顺利时分享喜悦，</span><span class="sentence-line">难熬时分担压力；</span><span class="sentence-line">遇到问题先站在一起，</span><span class="sentence-line">再寻找答案。</span><span class="sentence-line">婚姻的价值，</span><span class="sentence-line">不是让生活从此没有风雨，</span><span class="sentence-line">而是让人不必独自面对。</span></p>
<figure><img src="images/image-002.png" alt="伴侣在低谷时给予支持" loading="lazy"></figure>
<h2>被看见，才有安心的底气</h2>
<p><span class="sentence-line">亲密不是要求对方永远完美，</span><span class="sentence-line">而是看见平凡、疲惫与脆弱后，</span><span class="sentence-line">仍愿意理解、托底和守护。</span><span class="sentence-line">真正长久的陪伴，</span><span class="sentence-line">藏在一次次平常的回应里。</span></p>
<p><span class="sentence-line">走得慢没有关系，</span><span class="sentence-line">重要的是身边的人愿意一起走，</span><span class="sentence-line">也让你自在地做自己。</span></p>
<figure><img src="images/image-003.png" alt="长久伴侣在平凡日子里并肩" loading="lazy"></figure>
