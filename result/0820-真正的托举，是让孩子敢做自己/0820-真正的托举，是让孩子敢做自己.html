      <header><h1>真正的托举，是让孩子敢做自己</h1></header>
      <p class="lead"><span class="sentence-line">有些伤害披着“为你好”的外衣，</span><span class="sentence-line">家却不再安全。</span></p>
<h2>语言会进入孩子心里</h2>
<p><span class="sentence-line">嘲讽、否定和翻旧账听得多了，</span><span class="sentence-line">孩子会把“我不行”当成事实。</span><span class="sentence-line">严格若靠羞辱维持，</span><span class="sentence-line">留下的往往是自卑、敏感和讨好。</span></p>
<figure><img src="images/image-001.png" alt="父母与孩子面对面交流" loading="lazy"></figure>
<h2>控制不等于保护</h2>
<p><span class="sentence-line">替孩子决定一切，</span><span class="sentence-line">不准反驳、不许犯错，</span><span class="sentence-line">看似省心，</span><span class="sentence-line">却夺走了他判断和承担的机会。</span><span class="sentence-line">长期被压制，</span><span class="sentence-line">可能退缩，</span><span class="sentence-line">也可能激烈反抗。</span></p>
<figure><img src="images/image-002.png" alt="父母先倾听孩子" loading="lazy"></figure>
<figure><img src="images/image-003.png" alt="允许孩子从错误中成长" loading="lazy"></figure>
<h2>托举是把力量还给孩子</h2>
<p><span class="sentence-line">养育不是要求永远听话，</span><span class="sentence-line">而是陪孩子认识情绪、承担后果、练习选择。</span><span class="sentence-line">父母少一点打压，</span><span class="sentence-line">多一些倾听和尊重，</span><span class="sentence-line">家才会成为他受挫后敢回来的地方。</span></p>
<blockquote><span class="sentence-line">别做最早的否定者，</span><span class="sentence-line">要做最稳的支持者。</span></blockquote>
<figure><img src="images/image-004.png" alt="父母给予孩子选择和支持" loading="lazy"></figure>
