  <main>
    <article>
      <header><h1>别把母爱活成一张成绩单</h1></header>
      <p class="lead"><span class="sentence-line">别把母爱变成考核表。</span></p>
<h2>先放下比较</h2>
<p><span class="sentence-line">运动会输了，</span><span class="sentence-line">孩子把责任归到妈妈身上。</span><span class="sentence-line">她没有争辩，</span><span class="sentence-line">只把失败变成笑话：亲子相处，</span><span class="sentence-line">不必事事赢。</span></p>
<figure><img src="images/image-001.png" alt="亲子在运动场上的幽默时刻" loading="lazy"></figure>
<h2>家里不必完美</h2>
<p><span class="sentence-line">精致手工、可爱便当、全对作业、随叫随到，</span><span class="sentence-line">再加一份收入，</span><span class="sentence-line">像张填不满的成绩单。</span><span class="sentence-line">偶尔普通，</span><span class="sentence-line">家也不会失去温度。</span></p>
<figure><img src="images/image-002.png" alt="忙碌母亲与孩子的生活场景" loading="lazy"></figure>
<h2>把余力还给自己</h2>
<p><span class="sentence-line">真正的底线，</span><span class="sentence-line">是大人和孩子都平安健康。</span><span class="sentence-line">少一点消耗，</span><span class="sentence-line">多一点休息和笑声；</span><span class="sentence-line">六十分的妈妈，</span><span class="sentence-line">也能给孩子稳定而真诚的爱。</span></p>
<figure><img src="images/image-003.png" alt="母亲牵着孩子轻松向前" loading="lazy"></figure>
