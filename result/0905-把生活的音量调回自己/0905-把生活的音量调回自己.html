      <header><h1>把生活的音量调回自己</h1></header>
      <h2>停止消耗</h2>
<p><span class="sentence-line">烦躁的群，</span><span class="sentence-line">退出；</span><span class="sentence-line">不想去的饭局，</span><span class="sentence-line">拒绝。</span><span class="sentence-line">边界无需批准。</span></p>
<figure><img src="images/image-001.png" alt="退出消耗关系后恢复安静" loading="lazy"></figure>
<h2>选择自己</h2>
<p><span class="sentence-line">别人的失望重要，</span><span class="sentence-line">自己的感受也算数。</span><span class="sentence-line">少赴一场勉强的约，</span><span class="sentence-line">多一点自己的时间。</span></p>
<figure><img src="images/image-002.png" alt="拒绝不想参加的饭局后轻快前行" loading="lazy"></figure>
<h2>腾出位置</h2>
<p><span class="sentence-line">剪掉旧发、收起旧物，</span><span class="sentence-line">提醒自己：身份可以更新。</span><span class="sentence-line">告别虽疼，</span><span class="sentence-line">也为未来让路。</span></p>
<figure><img src="images/image-003.png" alt="告别旧版本后的自我更新" loading="lazy"></figure>
<h2>把快乐请回</h2>
<p><span class="sentence-line">再见很难，</span><span class="sentence-line">做过几次便懂：清理错的人和事，</span><span class="sentence-line">把方向盘交还自己。</span></p>
<figure><img src="images/image-004.png" alt="清理旧关系后重新获得轻盈" loading="lazy"></figure>
