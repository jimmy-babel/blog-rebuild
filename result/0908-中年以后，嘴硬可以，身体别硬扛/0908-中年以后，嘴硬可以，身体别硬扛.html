      <header><h1>中年以后，嘴硬可以，身体别硬扛</h1></header>
      <h2>先看体检单</h2>
<p><span class="sentence-line">体检单变红，</span><span class="sentence-line">先别吓自己。</span><span class="sentence-line">少喝一杯、早睡一晚，</span><span class="sentence-line">能改一项就是进步。</span><span class="sentence-line">嘴上说没事，</span><span class="sentence-line">行动别拖。</span></p>
<figure><img src="images/image-001.png" alt="中年男人看体检报告，桌边放着养生茶" loading="lazy"></figure>
<h2>家人最会补刀</h2>
<p><span class="sentence-line">孩子一句玩笑，</span><span class="sentence-line">常比体重秤精准。</span><span class="sentence-line">中年人的体面，</span><span class="sentence-line">是被调侃后还能笑。</span></p>
<figure><img src="images/image-002.png" alt="父子轻松斗嘴" loading="lazy"></figure>
<h2>偷一点清静</h2>
<p><span class="sentence-line">钓鱼空手也算收获：在河边坐一天，</span><span class="sentence-line">暂时不被工作家务追赶，</span><span class="sentence-line">就是成年人的小确幸。</span></p>
<figure><img src="images/image-003.png" alt="夫妻围绕休息与家务的幽默冲突" loading="lazy"></figure>
<h2>和生活讲和</h2>
<p><span class="sentence-line">少年心还在，</span><span class="sentence-line">身体会提醒你慢点。</span><span class="sentence-line">承认累，</span><span class="sentence-line">接受不完美，</span><span class="sentence-line">日子反而松快。</span></p>
<figure><img src="images/image-004.png" alt="夫妻温暖拥抱" loading="lazy"></figure>
