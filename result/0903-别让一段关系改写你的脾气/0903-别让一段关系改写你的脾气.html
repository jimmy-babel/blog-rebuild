      <header><h1>别让一段关系改写你的脾气</h1></header>
      <p class="lead"><span class="sentence-line">合适的关系让人松弛，</span><span class="sentence-line">而不是随时备战。</span></p>
<h2>先辨认消耗</h2>
<p><span class="sentence-line">如果见完一个人总要反复复盘，</span><span class="sentence-line">情绪也从平静变成紧绷，</span><span class="sentence-line">问题未必在你。</span><span class="sentence-line">长期的否定、试探和纠缠，</span><span class="sentence-line">会占用耐心。</span></p>

<h2>别把防备当性格</h2>
<p><span class="sentence-line">人在不安全的相处里，</span><span class="sentence-line">会学会解释、反击和留后手。</span><span class="sentence-line">久而久之，</span><span class="sentence-line">真诚被磨成锋利，</span><span class="sentence-line">连自己也不喜欢这样的状态。</span></p>
<figure><img src="images/image-002.png" alt="品牌女孩在舒适空间里自在弹琴" loading="lazy"></figure>
<h2>把距离当作选择</h2>
<p><span class="sentence-line">筛选关系不是冷漠，</span><span class="sentence-line">也不是要求所有人都懂你。</span><span class="sentence-line">对反复拉低你、逼你失控的人，</span><span class="sentence-line">少解释，</span><span class="sentence-line">停纠缠，</span><span class="sentence-line">及时退出。</span><span class="sentence-line">留下让你平和的人。</span></p>
