      <header><h1>后来才明白，青春真正难忘的不是考试</h1></header>
      <p class="lead"><span class="sentence-line">我们怀念的，</span><span class="sentence-line">往往不是那张试卷，</span><span class="sentence-line">而是那个相信未来什么都来得及的自己。</span></p>
<h2>记忆先从小事回来</h2>
<p><span class="sentence-line">多年后想起校园，</span><span class="sentence-line">最先出现的不是分数，</span><span class="sentence-line">而是风扇吹起的衣角、课桌上短暂的午睡，</span><span class="sentence-line">还有老师那句当时刺耳、后来却让人发笑的话。</span></p>
<figure class="source-image-link" data-source-index="8"><p>原始图片链接：<a class="source-image-url" href="https://mmbiz.qpic.cn/mmbiz_png/UVsZ2xn51XJIHsVX8fYc1Lu8uhHWs4S3PLXRk0shJFrmy98Zw4bN5sxQydSptnb6qs9d5XD8nImAyy9mBSRFE4TIut6vcPDDz5HEwepOhicc/640?wx_fmt=png&amp;from=appmsg" target="_blank" rel="noreferrer">https://mmbiz.qpic.cn/mmbiz_png/UVsZ2xn51XJIHsVX8fYc1Lu8uhHWs4S3PLXRk0shJFrmy98Zw4bN5sxQydSptnb6qs9d5XD8nImAyy9mBSRFE4TIut6vcPDDz5HEwepOhicc/640?wx_fmt=png&amp;from=appmsg</a></p></figure>
<h2>离开以后，选择才真正开始</h2>
<p><span class="sentence-line">毕业并没有把人生变简单。</span><span class="sentence-line">志愿、城市、工作，</span><span class="sentence-line">每一步都要在期待与现实之间落笔；</span><span class="sentence-line">所谓自由，</span><span class="sentence-line">不是终于没人替你决定，</span><span class="sentence-line">而是你愿意承担自己的选择。</span></p>
<figure class="source-image-link" data-source-index="13"><p>原始图片链接：<a class="source-image-url" href="https://mmbiz.qpic.cn/mmbiz_jpg/UVsZ2xn51XLUJAda7eIIdvPXWpX5ZAPxI9N3rEzSTicUCj5Ky3dnIXzx7Q73N7YOD2PoZKZS0wgrfcN3icRbiaD8YSSSMUDSIBCOQB4oEj5oPc/640?wx_fmt=jpeg&amp;from=appmsg" target="_blank" rel="noreferrer">https://mmbiz.qpic.cn/mmbiz_jpg/UVsZ2xn51XLUJAda7eIIdvPXWpX5ZAPxI9N3rEzSTicUCj5Ky3dnIXzx7Q73N7YOD2PoZKZS0wgrfcN3icRbiaD8YSSSMUDSIBCOQB4oEj5oPc/640?wx_fmt=jpeg&amp;from=appmsg</a></p></figure>
<h2>那场考试只是起点</h2>
<p><span class="sentence-line">高考像一扇窄门，</span><span class="sentence-line">却不是人生的总评语。</span><span class="sentence-line">后来会有新的难题，</span><span class="sentence-line">也会有意外的出口。</span><span class="sentence-line">回头看，</span><span class="sentence-line">最该安慰的不是考得好不好，</span><span class="sentence-line">而是那个已经拼尽力气的少年：别怕，</span><span class="sentence-line">路还很长。</span></p>
<figure class="source-image-link" data-source-index="19"><p>原始图片链接：<a class="source-image-url" href="https://mmbiz.qpic.cn/mmbiz_jpg/UVsZ2xn51XLnicP92QFtictXtJc3PqBZ75YyGyGbJ16Wzx95iaam0lA27acWWFfwLr8qPYWGvhMia1a2urltboFnibYfVlExWibtVib2pa0QJBAl1s/640?wx_fmt=jpeg&amp;from=appmsg" target="_blank" rel="noreferrer">https://mmbiz.qpic.cn/mmbiz_jpg/UVsZ2xn51XLnicP92QFtictXtJc3PqBZ75YyGyGbJ16Wzx95iaam0lA27acWWFfwLr8qPYWGvhMia1a2urltboFnibYfVlExWibtVib2pa0QJBAl1s/640?wx_fmt=jpeg&amp;from=appmsg</a></p></figure>
