interface:
  display_name: "微信文章原创重构"
  short_description: "提取并浓缩重构微信文章，重制配图并归档清洗后的原始图文"
  default_prompt: "使用 $recreate-wechat-article [--article-mode trans|ori] [--image-mode rebuild|copy|comic] [--comic-count N] [--caption-mode ai|local] [--brand on|off] 处理微信公众号文章链接；文章默认采用 trans，图片默认采用 copy + ai + brand on，comic 默认生成 5 张连续叙事图，并输出含原文归档的离线文章目录。"
